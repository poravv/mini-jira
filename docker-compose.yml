services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minijira}
      POSTGRES_USER: ${POSTGRES_USER:-minijira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minijira}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minijira} -d ${POSTGRES_DB:-minijira}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Reservado para el futuro módulo de auditoría — el backend aún no lo usa.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: apps/backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-minijira}
      DB_USER: ${POSTGRES_USER:-minijira}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-minijira}
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET (mínimo 32 caracteres) antes de iniciar Docker}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: apps/frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
