server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # El HTML es el punto de entrada de Angular. No se debe mantener en caché:
    # podría referenciar bundles de una versión anterior después de un deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida cae en index.html (el router de Angular resuelve)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: se reenvía al servicio "backend" definido en docker-compose
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
