databaseChangeLog:
  - changeSet:
      id: 005-add-issue-project-assignee
      author: mini-jira
      changes:
        - addColumn:
            tableName: issues
            columns:
              - column:
                  name: proyecto_id
                  type: bigint
              - column:
                  name: asignado_a_id
                  type: bigint
        - addForeignKeyConstraint:
            baseTableName: issues
            baseColumnNames: proyecto_id
            referencedTableName: proyecto
            referencedColumnNames: id
            constraintName: fk_issue_proyecto
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: issues
            baseColumnNames: asignado_a_id
            referencedTableName: usuario
            referencedColumnNames: id
            constraintName: fk_issue_asignado_a
            onDelete: SET NULL
