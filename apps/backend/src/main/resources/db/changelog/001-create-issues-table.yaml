databaseChangeLog:
  - changeSet:
      id: 001-create-issues-table
      author: mini-jira
      changes:
        - createTable:
            tableName: issues
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDIENTE
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: varchar(20)
                  defaultValue: MEDIA
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
