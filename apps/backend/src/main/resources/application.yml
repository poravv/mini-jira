server:
  port: 8080

spring:
  application:
    name: mini-jira-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minijira}
    username: ${DB_USER:minijira}
    password: ${DB_PASSWORD:minijira}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  # Timeouts de todo RestClient de la app (hoy solo Open-Meteo): un proveedor lento no debe colgar la API.
  http:
    client:
      connect-timeout: 3s
      read-timeout: 3s

weather:
  open-meteo:
    url: https://api.open-meteo.com/v1/forecast

security:
  jwt:
    # Base64 de una clave de al menos 32 bytes. En despliegues reales, reemplazar por JWT_SECRET.
    secret: ${JWT_SECRET:bWluaS1qaXJhLWRldi1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyEhIQ==}
    issuer: ${JWT_ISSUER:mini-jira}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
